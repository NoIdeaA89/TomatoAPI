name: Backend CI/CD

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: ./backend
        run: pip install -r requirements-dev.txt

      - name: Correr tests
        working-directory: ./backend
        run: pytest -v

  docker-build-check:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de la imagen Docker
        run: docker build -t backend-app ./backend

      - name: Smoke test (el contenedor arranca y responde en /health)
        run: |
          docker run -d --name api -p 8000:8000 -e DATABASE_URL=sqlite:////tmp/smoke.db backend-app
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

  deploy:
    needs: docker-build-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy en Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  smoke-prod:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Esperar que el backend responda
        run: |
          sleep 60
          for i in $(seq 1 30); do
            if curl -fs https://tomatoapi-v2ap.onrender.com/health; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Verificar CORS desde el frontend
        run: |
          curl -fsi -X OPTIONS https://tomatoapi-v2ap.onrender.com/auth/login \
            -H "Origin: https://tomatoapi-1.onrender.com" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" \
            | grep -i "access-control-allow-origin: https://tomatoapi-1.onrender.com"
