name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: ./backend
        run: pip install -r requirements-dev.txt

      - name: Correr tests
        working-directory: ./backend
        run: pytest -v

  docker-build-check:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de la imagen Docker
        run: docker build -t backend-app ./backend

      - name: Smoke test (el contenedor arranca y responde en /health)
        run: |
          docker run -d --name api -p 8000:8000 -e DATABASE_URL=sqlite:////tmp/smoke.db backend-app
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

  deploy:
    needs: docker-build-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy en Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
