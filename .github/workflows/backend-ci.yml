name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Correr tests
        working-directory: ./backend
        run: pytest

  docker-build-check:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que la imagen buildea
        run: docker build -t backend-app ./backend

  deploy:
    needs: docker-build-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy en Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
